name: e2e

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "image/**"
      - ".github/workflows/e2e.yaml"
    branches-ignore:
      - renovate/*
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_name: github-token-broker-e2e
  TF_VAR_github_app_id: ${{ vars.BROKER_E2E_APP_ID }}
  TF_VAR_existing_kms_key_arn: ${{ vars.BROKER_E2E_KMS_KEY_ARN }}
  TF_VAR_key_admin_role_arn: ${{ vars.BROKER_E2E_AWS_ROLE_ARN }}
  E2E_AWS_ROLE_ARN: ${{ vars.BROKER_E2E_AWS_ROLE_ARN }}
  E2E_STATE_BUCKET: ${{ vars.BROKER_E2E_STATE_BUCKET }}
  TF_VAR_image_tag: e2e-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/complete
    steps:
      - name: Check prerequisites
        working-directory: .
        run: |
          if [[ -z $TF_VAR_github_app_id || -z $TF_VAR_existing_kms_key_arn || -z $E2E_AWS_ROLE_ARN || -z $E2E_STATE_BUCKET ]]; then
            echo "::error::Set the BROKER_E2E_APP_ID, BROKER_E2E_KMS_KEY_ARN, BROKER_E2E_AWS_ROLE_ARN and BROKER_E2E_STATE_BUCKET repository variables; see 'End-to-end test' in the README."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Init
        run: |
          cat > backend_override.tf <<'HCL'
          terraform {
            backend "s3" {
              key    = "terraform-aws-github-token-broker/e2e.tfstate"
              region = "eu-central-1"
            }
          }
          HCL
          terraform init -input=false -backend-config="bucket=$E2E_STATE_BUCKET"

      - name: Create ECR repositories
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.this

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push exchange image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image/exchange
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.TF_VAR_name }}-exchange:${{ env.TF_VAR_image_tag }}

      - name: Build and push webhook image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image/webhook
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.TF_VAR_name }}-webhook:${{ env.TF_VAR_image_tag }}

      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Exchange
        run: |
          set -euo pipefail
          domain=$(terraform output -raw domain)
          url=$(terraform output -raw exchange_url)

          status=$(curl -sS -o /dev/null -w '%{http_code}' "$url?scope=$GITHUB_REPOSITORY&identity=e2e")
          [[ $status == 401 ]] || { echo "::error::unauthenticated exchange returned $status, expected 401"; exit 1; }

          oidc=$(curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$domain" | jq -r .value)

          token=$(curl -sS --fail-with-body --retry 3 --retry-all-errors -H "Authorization: Bearer $oidc" \
            "$url?scope=$GITHUB_REPOSITORY&identity=e2e" | jq -r .token)
          [[ -n $token && $token != null ]] || { echo "::error::exchange returned no token"; exit 1; }
          echo "::add-mask::$token"

          curl -sS --fail -o /dev/null -H "Authorization: Bearer $token" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY"

          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            "https://api.github.com/repos/DND-IT/github-workflows")
          [[ $status == 404 ]] || { echo "::error::token reached another repository ($status)"; exit 1; }

      - name: Destroy
        if: always()
        run: terraform destroy -input=false -auto-approve
